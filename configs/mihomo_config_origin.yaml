  - DOMAIN-SUFFIX,api.openai.com,hl13893j
  - DOMAIN-SUFFIX,openaicom.imgix.net,hl13893j
  - DOMAIN-SUFFIX,openaiassets.com,hl13893j
  - DOMAIN-SUFFIX,completion.openaai.com,hl13893j

  # 🧠 Anthropic / Claude
  - DOMAIN-KEYWORD,claude,hl13893j
  - DOMAIN-SUFFIX,claude.ai,hl13893j
  - DOMAIN-SUFFIX,platform.claude.ai,hl13893j
  - DOMAIN-SUFFIX,code.claude.ai,hl13893j
  - DOMAIN-SUFFIX,anthropic.com,hl13893j
  - DOMAIN-SUFFIX,api.anthropic.com,hl13893j

  # 📺 YouTube / 視頻高流量前置優先（確保高流量 100% 直連不浪費代理點）
  - DOMAIN-SUFFIX,googlevideo.com,DIRECT
  - DOMAIN-SUFFIX,ytimg.com,DIRECT
  - DOMAIN-SUFFIX,youtube.com,DIRECT
  - DOMAIN-SUFFIX,youtu.be,DIRECT

  # 🔑 Google 核心認證、API、DoH 安全 DNS 加速（AI Studio 登錄加載與可用地區文檔必備，不容缺少）
  - DOMAIN-KEYWORD,google,hl13893j
  - DOMAIN-KEYWORD,googleapis,hl13893j
  - DOMAIN-SUFFIX,gstatic.com,hl13893j
  - DOMAIN-SUFFIX,googleusercontent.com,hl13893j

  # 🔵 Gemini / Vertex / Bard / AI Studio 專屬後綴
  - DOMAIN-KEYWORD,google-ai,hl13893j
  - DOMAIN-KEYWORD,gemini,hl13893j
  - DOMAIN-SUFFIX,aistudio.google.com,hl13893j
  - DOMAIN-SUFFIX,ai.google.dev,hl13893j
  - DOMAIN-SUFFIX,makersuite.google.com,hl13893j
  - DOMAIN-SUFFIX,bard.google.com,hl13893j
  - DOMAIN-SUFFIX,gemini.google.com,hl13893j
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,hl13893j
  - DOMAIN-SUFFIX,vertexai.cloud.google.com,hl13893j
  - DOMAIN-SUFFIX,aiplatform.googleapis.com,hl13893j

  # 🐍 DeepSeek / Perplexity / Grok (AI 代理點)
  - DOMAIN-SUFFIX,perplexity.ai,hl13893j
  - DOMAIN-SUFFIX,api.perplexity.ai,hl13893j
  - DOMAIN-SUFFIX,grok.com,hl13893j

  # 🌐 常規出口 IP 檢測方便調試
  - DOMAIN-SUFFIX,ip.sb,hl13893j
  - DOMAIN-SUFFIX,ipinfo.io,hl13893j

  # 🛡️ 廣告 / 追蹤 REJECT
  - DOMAIN-SUFFIX,doubleclick.net,REJECT

  # 🌍 其他所有非中國、常規海外流量、X/Twitter、Instagram、Discord、GitHub、NPM 100% 全直連！
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT